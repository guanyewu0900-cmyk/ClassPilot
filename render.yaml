services:
  - type: web
    name: classpilot
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CHATANYWHERE_BASE_URL
        value: https://api.chatanywhere.tech/v1
      - key: CHATANYWHERE_API_KEY
        sync: false
      - key: CHATANYWHERE_DEEPSEEK_CHAT_MODEL
        value: deepseek-chat
      - key: CHATANYWHERE_DEEPSEEK_REASONER_MODEL
        value: deepseek-v3.2-thinking
      - key: CHATANYWHERE_OPENAI_MODEL
        value: gpt-5.6-sol
      - key: CHATANYWHERE_CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: CHATANYWHERE_KIMI_MODEL
        value: kimi-k2.5
