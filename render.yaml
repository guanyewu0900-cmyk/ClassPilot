services:
  - type: web
    name: classpilot
    runtime: node
    plan: free
    buildCommand: npm run check
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_CHAT_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_REASONER_MODEL
        value: deepseek-reasoner
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com/v1
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: KIMI_BASE_URL
        value: https://api.moonshot.cn/v1
      - key: KIMI_API_KEY
        sync: false
      - key: KIMI_MODEL
        sync: false
